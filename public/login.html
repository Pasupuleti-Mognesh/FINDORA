
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FINDORA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<canvas id="tubes-canvas"></canvas>

<header class="site-header">
    <a class="logo" href="index.html">FINDORA<span>.</span></a>

    <button class="menu-toggle" aria-label="Toggle navigation">☰</button>

    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse Items</a>
        <a href="report.html">Report Item</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="admin.html">Admin</a>
    </nav>

    <div class="nav-actions">
        <a class="btn btn-quiet" href="login.html">Login</a>
        <a class="btn btn-primary" href="register.html">Sign Up</a>
    </div>
</header>

<main>
    <section class="page-intro">
        <div class="eyebrow">Welcome back</div>

        <h1 class="page-title">
            Login to <span class="gradient-text">FINDORA</span>
        </h1>

        <p>Access your reports and claims.</p>
    </section>

    <div class="form-wrap">
        <form class="form-card" data-auth="login">

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    placeholder="you@university.edu"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="8"
                    required
                    placeholder="Enter password"
                >
            </div>

            <button class="btn btn-primary" type="submit">
                Login
            </button>

            <p class="muted">
                New to FINDORA?
                <a class="accent" href="register.html">
                    Create an account
                </a>
            </p>

        </form>
    </div>
</main>

<footer class="site-footer">
    <div class="logo">FINDORA<span>.</span></div>
    <p>Helping campus belongings find their way home.</p>
    <small>© 2026 FINDORA. Campus Lost & Found.</small>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
